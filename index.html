<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comic Store Map</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate icon" href="/favicon.ico" type="image/x-icon">
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Comic Store Map</h1>
      <p>A map of comic book stores with bin diving opportunities</p>
    </header>
    
    <div class="controls">
      <div class="search">
        <input type="text" id="search" placeholder="Search for a store...">
      </div>
      <div class="filter">
        <select id="state-filter">
          <option value="">All States</option>
        </select>
      </div>
    </div>

    <div class="map-container">
      <div id="map"></div>
    </div>
    
    <div id="store-details" class="hidden">
      <button id="close-details">×</button>
      <h2 id="store-name"></h2>
      <div id="store-info">
        <p id="store-address"></p>
        <p id="store-phone"></p>
        <p><a id="store-website" target="_blank">Visit Website</a></p>
        <p><a id="store-maps" target="_blank">View on Google Maps</a></p>
        <p id="store-description" class="store-description"></p>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
