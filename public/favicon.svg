<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background circle for better visibility in browser tabs -->
  <circle cx="50" cy="50" r="48" fill="white" stroke="#000" stroke-width="2"/>
  
  <!-- Comic book bin -->
  <rect x="12" y="30" width="76" height="50" rx="4" ry="4" fill="#FFEB3B" stroke="#000" stroke-width="3"/>
  
  <!-- Comics sticking out of bin -->
  <rect x="15" y="12" width="16" height="40" rx="2" ry="2" fill="#FE111A" stroke="#000" stroke-width="2" />
  <rect x="34" y="8" width="15" height="45" rx="2" ry="2" fill="#3062D6" stroke="#000" stroke-width="2" />
  <rect x="52" y="14" width="15" height="38" rx="2" ry="2" fill="#2E7D32" stroke="#000" stroke-width="2" />
  <rect x="70" y="10" width="15" height="42" rx="2" ry="2" fill="#9C27B0" stroke="#000" stroke-width="2" />
  
  <!-- Dollar sign - now using a path instead of text for better browser compatibility -->
  <path d="M32,68 C32,73 40,73 40,68 C40,63 32,63 32,58 C32,53 40,53 40,58 M36,50 L36,76" 
        fill="none" stroke="#000" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Magnifying glass -->
  <circle cx="68" cy="63" r="10" fill="white" stroke="#000" stroke-width="4"/>
  <line x1="75" y1="71" x2="84" y2="82" stroke="#000" stroke-width="5" stroke-linecap="round"/>
</svg>