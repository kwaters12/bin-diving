<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Comic book bin background -->
  <rect x="10" y="15" width="80" height="70" rx="5" ry="5" fill="#FFEB3B" stroke="#000" stroke-width="3"/>
  
  <!-- Comic books sticking out of bin -->
  <rect x="15" y="10" width="15" height="40" rx="2" ry="2" fill="#FE111A" stroke="#000" stroke-width="2" />
  <rect x="33" y="5" width="15" height="45" rx="2" ry="2" fill="#3062D6" stroke="#000" stroke-width="2" />
  <rect x="52" y="12" width="15" height="38" rx="2" ry="2" fill="#2E7D32" stroke="#000" stroke-width="2" />
  <rect x="70" y="8" width="15" height="42" rx="2" ry="2" fill="#9C27B0" stroke="#000" stroke-width="2" />
  
  <!-- Dollar sign -->
  <text x="50" y="65" font-family="Arial Black" font-size="30" text-anchor="middle" fill="#000" stroke="#000" stroke-width="1">$</text>
  
  <!-- Magnifying glass -->
  <circle cx="65" cy="65" r="12" fill="none" stroke="#000" stroke-width="3"/>
  <line x1="73" y1="73" x2="85" y2="85" stroke="#000" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Bubble lines for 'treasure found' -->
  <path d="M30,55 C35,50 40,50 45,55" fill="none" stroke="#000" stroke-width="2" />
  <path d="M33,50 C37,46 41,46 45,50" fill="none" stroke="#000" stroke-width="2" />
</svg>